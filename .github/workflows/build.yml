name: Build

# Build the Windows/MSVC/MFC target with CMake and publish the resulting
# mshearts.exe as a downloadable Actions artifact.  On tagged releases the
# same binary is also attached to the GitHub Release.
#
# windows-latest ships Visual Studio 2022 (with the MFC component) and the
# Windows SDK, which are the toolchain requirements documented in README.md.

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mshearts (Windows x64, Release)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure with CMake (Visual Studio 2022, x64)
        # VS_GLOBAL_UseOfMFC in CMakeLists.txt selects static MFC, so the
        # MFC component bundled with the runner's VS install is required.
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Show built binary
        shell: pwsh
        run: |
          Get-Item build/Release/mshearts.exe |
            Select-Object FullName, Length, LastWriteTime

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mshearts-windows-x64
          path: build/Release/mshearts.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish binary to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: mshearts-windows-x64
          path: dist

      - name: Attach binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mshearts.exe
